<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>انتخاب زمان — طرح شبکه‌ای تمیز</title>
  <style>
    :root {
      --bg: #000000;
      --fg: #FAFAFA;
      --card: #0F0F10;
      --muted: #171717;
      --muted-fg: #B5B5B5;
      --border: #262626;
      --radius: 18px;
      --font: 'Vazirmatn', -apple-system, BlinkMacSystemFont, sans-serif;
    }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: var(--font); background: var(--bg); color: var(--fg); min-height: 100dvh; display: flex; justify-content: center; }
    .phone { width: 100%; max-width: 430px; padding: 16px; padding-bottom: 90px; }
    .header { display: flex; align-items: center; gap: 12px; margin-bottom: 20px; }
    .back { width: 36px; height: 36px; border-radius: 12px; background: var(--card); border: 1px solid var(--border); display: grid; place-items: center; color: var(--fg); }
    .title { font-size: 18px; font-weight: 700; }
    .subtitle { font-size: 13px; color: var(--muted-fg); }

    .days { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 12px; margin-bottom: 16px; scrollbar-width: none; }
    .days::-webkit-scrollbar { display: none; }
    .day { flex: 0 0 64px; height: 80px; border-radius: var(--radius); border: 1px solid var(--border); background: var(--card); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; cursor: pointer; }
    .day.active { background: var(--fg); color: var(--bg); border-color: var(--fg); }
    .day span { font-size: 11px; }
    .day strong { font-size: 18px; }

    .tabs { display: flex; gap: 8px; margin-bottom: 16px; }
    .tab { flex: 1; height: 40px; border-radius: 12px; background: var(--card); border: 1px solid var(--border); color: var(--muted-fg); font-family: var(--font); font-size: 13px; font-weight: 600; cursor: pointer; }
    .tab.active { background: var(--fg); color: var(--bg); border-color: var(--fg); }

    .section-title { font-size: 13px; color: var(--muted-fg); margin: 16px 0 10px; padding-right: 4px; }
    .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
    .chip { height: 44px; border-radius: 14px; background: var(--card); border: 1px solid var(--border); display: grid; place-items: center; font-size: 14px; font-weight: 600; cursor: pointer; transition: all 0.15s; }
    .chip:hover { background: var(--muted); }
    .chip.selected { background: var(--fg); color: var(--bg); border-color: var(--fg); }

    .cta { position: fixed; bottom: 16px; left: 16px; right: 16px; max-width: 398px; margin: 0 auto; height: 52px; border-radius: var(--radius); background: var(--fg); color: var(--bg); border: none; font-family: var(--font); font-size: 15px; font-weight: 700; cursor: pointer; }
  </style>
</head>
<body>
  <div class="phone">
    <div class="header">
      <div class="back">→</div>
      <div>
        <div class="title">انتخاب زمان</div>
        <div class="subtitle">یک ساعت را انتخاب کنید</div>
      </div>
    </div>

    <div class="days">
      <div class="day"><span>شنبه</span><strong>۱۲</strong></div>
      <div class="day active"><span>یک‌ش</span><strong>۱۳</strong></div>
      <div class="day"><span>دوش</span><strong>۱۴</strong></div>
      <div class="day"><span>سه‌ش</span><strong>۱۵</strong></div>
    </div>

    <div class="tabs">
      <button class="tab">صبح</button>
      <button class="tab active">عصر</button>
      <button class="tab">شب</button>
    </div>

    <div class="section-title">ساعت‌های پیشنهادی</div>
    <div class="grid">
      <div class="chip" onclick="selectChip(this)">۱۶:۰۰</div>
      <div class="chip selected" onclick="selectChip(this)">۱۶:۳۰</div>
      <div class="chip" onclick="selectChip(this)">۱:۰۰</div>
      <div class="chip" onclick="selectChip(this)">۱:۳۰</div>
    </div>

    <div class="section-title">ساعت‌های دیگر</div>
    <div class="grid">
      <div class="chip" onclick="selectChip(this)">۱۵:۳۰</div>
      <div class="chip" onclick="selectChip(this)">۱۵:۴۵</div>
      <div class="chip" onclick="selectChip(this)">۱:۴۵</div>
      <div class="chip" onclick="selectChip(this)">۱۹:۰۰</div>
    </div>

    <button class="cta">ادامه با ۱۶:۳۰</button>
  </div>
  <script>
    function selectChip(el) { document.querySelectorAll('.chip').forEach(c => c.classList.remove('selected')); el.classList.add('selected'); }
  </script>
</body>
</html>
