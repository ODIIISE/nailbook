<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#f4f4f3" />
  <title>پیش‌نمایش صفحه مشتری — استودیو ناخن فرزانه</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&display=swap');

    :root {
      --paper: #f4f4f3;
      --ink: #30302f;
      --ink-soft: #656563;
      --line: rgba(255,255,255,.92);
      --surface: rgba(255,255,255,.82);
      --surface-solid: #fff;
      --focus: #5a5a57;
      --shadow: 0 18px 45px rgba(39,39,37,.11);
      --shadow-soft: 0 8px 24px rgba(39,39,37,.09);
    }

    [data-theme="dark"] {
      --paper: #1b1b1a;
      --ink: #f4f4f2;
      --ink-soft: #b3b3ad;
      --line: rgba(255,255,255,.08);
      --surface: rgba(37,37,35,.88);
      --surface-solid: #292927;
      --focus: #f4f4f2;
      --shadow: 0 18px 45px rgba(0,0,0,.35);
      --shadow-soft: 0 8px 24px rgba(0,0,0,.25);
    }

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body { margin: 0; min-height: 100vh; background: #242422; color: var(--ink); font-family: 'Vazirmatn', Tahoma, sans-serif; -webkit-font-smoothing: antialiased; }
    button, a { font: inherit; }
    button { border: 0; cursor: pointer; }

    .preview-shell {
      width: min(100%, 430px);
      min-height: 100dvh;
      margin: 0 auto;
      position: relative;
      overflow: hidden;
      background-color: var(--paper);
      background-image: repeating-linear-gradient(90deg, transparent 0, transparent 40px, var(--line) 40px, var(--line) 42px);
      transition: background-color .28s ease, color .28s ease;
    }

    .preview-shell::before { content: ''; position: absolute; inset: 0; pointer-events: none; opacity: .75; background: radial-gradient(circle at 50% 20%, rgba(255,255,255,.55), transparent 32%), linear-gradient(180deg, transparent 0 70%, rgba(255,255,255,.14)); }

    .top-actions { position: relative; z-index: 3; display: flex; align-items: center; gap: 16px; padding: 32px 38px 0; }
    .round-control { width: 96px; height: 96px; display: grid; place-items: center; border-radius: 50%; background: var(--surface-solid); color: var(--ink); box-shadow: var(--shadow-soft); transition: transform .2s ease, background .25s ease, color .25s ease; }
    .round-control:hover { transform: translateY(-2px); }
    .round-control:active { transform: scale(.96); }
    .round-control:focus-visible, .quick-link:focus-visible, .booking-cta:focus-visible, .drawer-close:focus-visible, .drawer-link:focus-visible { outline: 3px solid var(--focus); outline-offset: 4px; }
    .hamburger { width: 36px; display: grid; gap: 7px; }
    .hamburger span { display: block; width: 36px; height: 3px; border-radius: 99px; background: currentColor; }
    .moon { width: 36px; height: 36px; border-radius: 50%; background: currentColor; position: relative; }
    .moon::after { content: ''; position: absolute; width: 34px; height: 34px; top: -7px; right: -10px; border-radius: 50%; background: var(--surface-solid); }

    .profile { position: relative; z-index: 1; padding: 112px 24px 0; text-align: center; }
    .portrait-ring { width: 224px; height: 224px; padding: 10px; margin: 0 auto 44px; border-radius: 50%; background: var(--surface-solid); box-shadow: 0 12px 32px rgba(39,39,37,.13), 0 0 0 1px rgba(255,255,255,.5); }
    .portrait { width: 100%; height: 100%; display: block; object-fit: cover; object-position: center 24%; border-radius: 50%; filter: saturate(.76) contrast(.96); }
    h1 { margin: 0; font-size: clamp(29px, 8.1vw, 38px); line-height: 1.35; font-weight: 800; letter-spacing: -.04em; }
    .slogan { margin: 18px 0 2px; color: var(--ink-soft); font-size: 20px; font-weight: 500; line-height: 1.6; }
    .location { margin: 0; color: var(--ink-soft); font-size: 19px; line-height: 1.7; }

    .quick-links { display: flex; justify-content: center; align-items: center; gap: 30px; margin-top: 36px; }
    .quick-link { width: 46px; height: 46px; display: grid; place-items: center; color: var(--ink); border-radius: 50%; transition: background .2s ease, transform .2s ease; }
    .quick-link:hover { background: var(--surface); transform: translateY(-2px); }
    .quick-link svg { width: 32px; height: 32px; fill: currentColor; }
    .quick-link .stroke-icon { fill: none; stroke: currentColor; stroke-width: 1.7; }

    .booking-area { position: relative; z-index: 2; padding: 176px 20px 40px; }
    .booking-card { padding: 10px; border-radius: 30px; background: var(--surface); box-shadow: var(--shadow); backdrop-filter: blur(15px); }
    .booking-cta { width: 100%; min-height: 78px; display: flex; align-items: center; justify-content: center; gap: 14px; padding: 16px 24px; border-radius: 23px; color: #fff; background: var(--ink); box-shadow: 0 8px 18px rgba(39,39,37,.18); transition: transform .2s ease, box-shadow .2s ease; }
    .booking-cta:hover { transform: translateY(-2px); box-shadow: 0 13px 24px rgba(39,39,37,.22); }
    .booking-cta:active { transform: scale(.985); }
    .booking-cta strong { font-size: 22px; font-weight: 700; }
    .booking-cta small { display: block; margin-top: 1px; color: rgba(255,255,255,.68); font-size: 12px; font-weight: 400; }
    .booking-cta svg { width: 28px; height: 28px; flex: 0 0 auto; transform: scaleX(-1); }
    .booking-note { margin: 18px 0 0; color: var(--ink-soft); text-align: center; font-size: 15px; line-height: 1.8; }
    .booking-note b { color: var(--ink); font-weight: 600; }
    .booking-status, .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0; }

    .drawer-backdrop { position: fixed; inset: 0; z-index: 10; background: rgba(0,0,0,.35); opacity: 0; pointer-events: none; transition: opacity .25s ease; }
    .drawer { position: fixed; top: 0; right: 0; bottom: 0; z-index: 11; width: min(320px, 86vw); padding: 28px 22px; background: var(--surface-solid); box-shadow: -14px 0 40px rgba(0,0,0,.18); transform: translateX(105%); visibility: hidden; transition: transform .3s cubic-bezier(.22,.8,.24,1), visibility 0s linear .3s; }
    body.menu-open .drawer-backdrop { opacity: 1; pointer-events: auto; }
    body.menu-open .drawer { transform: translateX(0); visibility: visible; transition-delay: 0s; }
    .drawer-head { display: flex; justify-content: space-between; align-items: center; padding-bottom: 22px; border-bottom: 1px solid var(--line); }
    .drawer-head strong { font-size: 17px; }
    .drawer-close { width: 44px; height: 44px; border-radius: 50%; background: var(--paper); color: var(--ink); font-size: 25px; }
    .drawer-list { display: grid; gap: 10px; padding-top: 24px; }
    .drawer-link { display: block; padding: 14px 16px; border-radius: 14px; color: var(--ink); text-decoration: none; background: var(--paper); }
    .mockup-label { position: fixed; z-index: 20; top: 14px; right: 14px; padding: 6px 10px; color: #fff; background: rgba(35,35,33,.78); border-radius: 7px; font: 600 10px/1.2 Arial, sans-serif; letter-spacing: .08em; text-transform: uppercase; }

    @media (max-width: 360px) {
      .round-control { width: 78px; height: 78px; }
      .top-actions { padding-inline: 24px; }
      .profile { padding-top: 88px; }
      .portrait-ring { width: 190px; height: 190px; }
      .booking-area { padding-top: 120px; }
    }
    @media (max-height: 760px) {
      .profile { padding-top: 72px; }
      .portrait-ring { width: 180px; height: 180px; margin-bottom: 28px; }
      .booking-area { padding-top: 104px; }
    }
    @media (min-width: 560px) {
      body { padding: 24px 0; }
      .preview-shell { min-height: calc(100dvh - 48px); border-radius: 32px; box-shadow: 0 28px 80px rgba(0,0,0,.28); }
      .drawer { position: absolute; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; transition-duration: .01ms !important; animation-duration: .01ms !important; }
    }
  </style>
</head>
<body>
  <div class="mockup-label">Customer home / preview</div>
  <main class="preview-shell">
    <div class="top-actions">
      <button class="round-control" id="menuButton" type="button" aria-label="باز کردن منو" aria-expanded="false"><span class="hamburger" aria-hidden="true"><span></span><span></span><span></span></span></button>
      <button class="round-control" id="themeButton" type="button" aria-label="تغییر حالت نمایش"><span class="moon" aria-hidden="true"></span></button>
    </div>

    <section class="profile" aria-labelledby="salon-name">
      <div class="portrait-ring"><img class="portrait" src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=560&q=82" alt="تصویر استودیو ناخن فرزانه" onerror="this.onerror=null;this.src='/hero-bg.webp';" /></div>
      <h1 id="salon-name">استودیو تخصصی ناخن فرزانه</h1>
      <p class="slogan">استودیو تخصصی ناخن فرزانه</p>
      <p class="location">مشهد · صارمی ۳۸</p>
      <div class="quick-links" aria-label="راه‌های ارتباطی">
        <a class="quick-link" href="tel:09151234567" aria-label="تماس با استودیو"><svg class="stroke-icon" viewBox="0 0 24 24"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.8 19.8 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.12 4.18 2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.12.9.33 1.78.62 2.63a2 2 0 0 1-.45 2.11L8 9.73a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.85.29 1.73.5 2.63.62A2 2 0 0 1 22 16.92Z" /></svg></a>
        <a class="quick-link" href="sms:09151234567" aria-label="ارسال پیامک"><svg class="stroke-icon" viewBox="0 0 24 24"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8Z" /></svg></a>
        <a class="quick-link" href="https://instagram.com" target="_blank" rel="noreferrer" aria-label="اینستاگرام"><svg viewBox="0 0 24 24"><path d="M7.75 2h8.5A5.75 5.75 0 0 1 22 7.75v8.5A5.75 5.75 0 0 1 16.25 22h-8.5A5.75 5.75 0 0 1 2 16.25v-8.5A5.75 5.75 0 0 1 7.75 2Zm0 1.75a4 4 0 0 0-4 4v8.5a4 4 0 0 0 4 4h8.5a4 4 0 0 0 4-4v-8.5a4 4 0 0 0-4-4h-8.5Zm8.75 1.5a1.25 1.25 0 1 1 0 2.5 1.25 1.25 0 0 1 0-2.5ZM12 7a5 5 0 1 1 0 10 5 5 0 0 1 0-10Zm0 1.75a3.25 3.25 0 1 0 0 6.5 3.25 3.25 0 0 0 0-6.5Z" /></svg></a>
      </div>
    </section>

    <section class="booking-area" id="booking" aria-label="رزرو نوبت">
      <div class="booking-card">
        <button class="booking-cta" id="bookingButton" type="button"><span><strong>رزرو نوبت</strong><small>انتخاب خدمت و زمان دلخواه</small></span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14" /><path d="m13 6 6 6-6 6" /></svg></button>
        <span class="booking-status" id="bookingStatus" aria-live="polite"></span>
      </div>
      <p class="booking-note">خدمت موردنظرت را انتخاب کن؛ <b>زمان‌های آزاد</b> همین‌جا نمایش داده می‌شوند.</p>
    </section>
  </main>

  <div class="drawer-backdrop" id="backdrop"></div>
  <aside class="drawer" id="drawer" role="dialog" aria-modal="true" aria-labelledby="drawerTitle" aria-hidden="true">
    <div class="drawer-head"><strong id="drawerTitle">استودیو فرزانه</strong><button class="drawer-close" id="closeButton" type="button" aria-label="بستن منو">×</button></div>
    <nav class="drawer-list"><a class="drawer-link" href="#booking">رزرو نوبت</a><a class="drawer-link" href="#salon-name">صفحه اصلی</a><a class="drawer-link" href="tel:09151234567">تماس با ما</a></nav>
  </aside>

  <script>
    const root = document.documentElement;
    const menuButton = document.getElementById('menuButton');
    const closeButton = document.getElementById('closeButton');
    const drawer = document.getElementById('drawer');
    const backdrop = document.getElementById('backdrop');
    const themeButton = document.getElementById('themeButton');
    const bookingButton = document.getElementById('bookingButton');
    const bookingStatus = document.getElementById('bookingStatus');
    const themeMeta = document.querySelector('meta[name="theme-color"]');
    let lastFocusedElement = null;

    function setMenu(open) {
      if (open) lastFocusedElement = document.activeElement;
      document.body.classList.toggle('menu-open', open);
      menuButton.setAttribute('aria-expanded', String(open));
      drawer.setAttribute('aria-hidden', String(!open));
      if (open) closeButton.focus();
      else if (lastFocusedElement && typeof lastFocusedElement.focus === 'function') lastFocusedElement.focus();
    }

    menuButton.addEventListener('click', () => setMenu(true));
    closeButton.addEventListener('click', () => setMenu(false));
    backdrop.addEventListener('click', () => setMenu(false));
    drawer.querySelectorAll('.drawer-link').forEach((link) => link.addEventListener('click', () => setMenu(false)));
    document.addEventListener('keydown', (event) => {
      if (event.key === 'Escape') setMenu(false);
      if (event.key === 'Tab' && document.body.classList.contains('menu-open')) {
        const focusable = drawer.querySelectorAll('button, a[href]');
        const first = focusable[0]; const last = focusable[focusable.length - 1];
        if (event.shiftKey && document.activeElement === first) { event.preventDefault(); last.focus(); }
        else if (!event.shiftKey && document.activeElement === last) { event.preventDefault(); first.focus(); }
      }
    });

    function updateThemeMeta() { themeMeta.setAttribute('content', root.dataset.theme === 'dark' ? '#1b1b1a' : '#f4f4f3'); }
    themeButton.addEventListener('click', () => {
      const dark = root.dataset.theme === 'dark';
      root.dataset.theme = dark ? 'light' : 'dark';
      localStorage.setItem('mockup-theme', dark ? 'light' : 'dark');
      updateThemeMeta();
    });
    if (localStorage.getItem('mockup-theme') === 'dark') root.dataset.theme = 'dark';
    updateThemeMeta();

    bookingButton.addEventListener('click', () => {
      const original = bookingButton.innerHTML;
      bookingButton.innerHTML = '<span><strong>در حال آماده‌سازی رزرو…</strong><small>در نسخه اصلی وارد انتخاب خدمات می‌شوید</small></span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12 4 4L19 6" /></svg>';
      bookingStatus.textContent = 'پیش‌نمایش رزرو فعال شد. در نسخه اصلی، انتخاب خدمات باز می‌شود.';
      setTimeout(() => { bookingButton.innerHTML = original; bookingStatus.textContent = ''; }, 1800);
    });
  </script>
</body>
</html>
