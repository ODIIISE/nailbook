<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Clean Slate — 5 Color Palettes</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: #0a0a0a;
      color: #fff;
      min-height: 100vh;
    }

    /* Selector Bar */
    .selector-bar {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 1000;
      background: rgba(0, 0, 0, 0.92);
      backdrop-filter: blur(20px);
      border-bottom: 1px solid rgba(255,255,255,0.08);
      padding: 20px 24px;
    }

    .selector-inner {
      max-width: 1400px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .selector-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .selector-header h2 {
      font-size: 20px;
      font-weight: 700;
    }

    .mode-toggle {
      display: flex;
      gap: 8px;
      background: rgba(255,255,255,0.05);
      padding: 4px;
      border-radius: 10px;
    }

    .mode-btn {
      padding: 8px 16px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;
      border: none;
      background: transparent;
      color: #888;
    }

    .mode-btn.active {
      background: rgba(255,255,255,0.12);
      color: #fff;
    }

    .palette-tabs {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      justify-content: center;
    }

    .palette-tab {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 12px 20px;
      border-radius: 12px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      border: 2px solid transparent;
      background: rgba(255,255,255,0.04);
      color: #888;
    }

    .palette-tab:hover {
      background: rgba(255,255,255,0.08);
      color: #fff;
    }

    .palette-tab.active {
      color: #fff;
      border-color: var(--tab-color);
      background: rgba(255,255,255,0.06);
    }

    .color-dot {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    /* Preview Container */
    .preview-container {
      padding-top: 140px;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      gap: 32px;
      padding-left: 32px;
      padding-right: 32px;
      flex-wrap: wrap;
    }

    /* Phone Frame */
    .phone-frame {
      width: 390px;
      height: 844px;
      border-radius: 40px;
      overflow: hidden;
      box-shadow: 0 25px 80px rgba(0,0,0,0.5), 0 0 0 8px #1a1a1a;
      position: relative;
      flex-shrink: 0;
    }

    .phone-frame.hidden { display: none; }

    .phone-content {
      width: 100%;
      height: 100%;
      overflow-y: auto;
      overflow-x: hidden;
      scrollbar-width: none;
    }

    .phone-content::-webkit-scrollbar { display: none; }

    /* ============ PALETTES ============ */
    [data-palette="ocean"] {
      --accent: #0EA5E9;
      --accent-hover: #0284C7;
      --accent-light: rgba(14, 165, 233, 0.1);
    }

    [data-palette="emerald"] {
      --accent: #10B981;
      --accent-hover: #059669;
      --accent-light: rgba(16, 185, 129, 0.1);
    }

    [data-palette="violet"] {
      --accent: #8B5CF6;
      --accent-hover: #7C3AED;
      --accent-light: rgba(139, 92, 246, 0.1);
    }

    [data-palette="rose"] {
      --accent: #F43F5E;
      --accent-hover: #E11D48;
      --accent-light: rgba(244, 63, 94, 0.1);
    }

    [data-palette="teal"] {
      --accent: #14B8A6;
      --accent-hover: #0D9488;
      --accent-light: rgba(20, 184, 166, 0.1);
    }

    /* Dark mode */
    [data-mode="dark"] {
      --bg: #000000;
      --bg-secondary: #16181C;
      --bg-tertiary: #1D1F23;
      --text: #E7E9EA;
      --text-secondary: #71767B;
      --text-tertiary: #536471;
      --border: #2F3336;
      --border-light: #1D1F23;
      --card: #16181C;
      --nav: rgba(0,0,0,0.88);
    }

    /* Light mode */
    [data-mode="light"] {
      --bg: #FFFFFF;
      --bg-secondary: #F8FAFC;
      --bg-tertiary: #F1F5F9;
      --text: #0F172A;
      --text-secondary: #64748B;
      --text-tertiary: #94A3B8;
      --border: #E2E8F0;
      --border-light: #F1F5F9;
      --card: #FFFFFF;
      --nav: rgba(255,255,255,0.92);
    }

    /* ============ APP STYLES ============ */
    .app {
      min-height: 100%;
      background: var(--bg);
      color: var(--text);
      transition: background 0.3s, color 0.3s;
    }

    .header {
      position: sticky;
      top: 0;
      z-index: 100;
      background: var(--nav);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--border);
      height: 56px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
    }

    .header-brand { display: flex; align-items: center; gap: 12px; }

    .header-logo {
      width: 32px;
      height: 32px;
      background: var(--accent);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .header-logo svg { width: 18px; height: 18px; color: #fff; }
    .header-title { font-size: 15px; font-weight: 700; }

    .header-menu {
      width: 40px;
      height: 40px;
      border-radius: 9999px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: background 0.15s;
    }

    .header-menu:hover { background: var(--bg-tertiary); }
    .header-menu svg { width: 20px; height: 20px; color: var(--text); }

    .hero { padding: 32px 16px 24px; text-align: center; }

    .hero-avatar {
      width: 80px;
      height: 80px;
      border-radius: 20px;
      background: var(--bg-tertiary);
      margin: 0 auto 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 2px solid var(--border);
    }

    .hero-avatar svg { width: 40px; height: 40px; color: var(--text-tertiary); }
    .hero-name { font-size: 28px; font-weight: 800; margin-bottom: 4px; letter-spacing: -0.02em; }
    .hero-slogan { font-size: 15px; font-weight: 500; color: var(--accent); margin-bottom: 8px; }
    .hero-desc { font-size: 14px; color: var(--text-secondary); max-width: 320px; margin: 0 auto 20px; line-height: 1.6; }

    .info-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 16px;
      margin: 0 16px 24px;
    }

    .info-row { display: flex; align-items: center; gap: 12px; padding: 10px 0; }
    .info-row:not(:last-child) { border-bottom: 1px solid var(--border-light); }

    .info-icon {
      width: 36px;
      height: 36px;
      border-radius: 10px;
      background: var(--accent-light);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .info-icon svg { width: 18px; height: 18px; color: var(--accent); }
    .info-text { font-size: 14px; }

    .cta-container { padding: 0 16px 32px; }

    .cta-button {
      width: 100%;
      height: 56px;
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 14px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: all 0.2s;
    }

    .cta-button:hover { background: var(--accent-hover); transform: translateY(-1px); }
    .cta-button svg { width: 20px; height: 20px; transform: scaleX(-1); }

    .section-header { padding: 0 16px; margin-bottom: 16px; }
    .section-title { font-size: 20px; font-weight: 700; }

    .services-container { padding: 0 16px 32px; }

    .service-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 16px;
      margin-bottom: 12px;
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .service-card:hover { border-color: var(--accent); }

    .service-image {
      width: 64px;
      height: 64px;
      border-radius: 12px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .service-image svg { width: 28px; height: 28px; color: #fff; }
    .service-info { flex: 1; min-width: 0; }
    .service-name { font-size: 15px; font-weight: 600; margin-bottom: 2px; }
    .service-desc { font-size: 13px; color: var(--text-secondary); margin-bottom: 8px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .service-meta { display: flex; align-items: center; gap: 12px; }
    .service-meta-item { display: flex; align-items: center; gap: 4px; font-size: 12px; color: var(--text-secondary); }
    .service-meta-item svg { width: 14px; height: 14px; }
    .service-meta-item.price { color: var(--accent); font-weight: 600; }
    .service-arrow { width: 20px; height: 20px; color: var(--text-tertiary); flex-shrink: 0; }

    .highlights-container { padding: 0 16px 32px; }
    .highlights-scroll { display: flex; gap: 12px; overflow-x: auto; padding-bottom: 8px; scrollbar-width: none; }
    .highlights-scroll::-webkit-scrollbar { display: none; }

    .highlight-card {
      width: 120px;
      height: 160px;
      border-radius: 16px;
      flex-shrink: 0;
      cursor: pointer;
      position: relative;
      overflow: hidden;
      transition: transform 0.2s;
    }

    .highlight-card:hover { transform: scale(1.02); }
    .highlight-card::after { content: ''; position: absolute; inset: 0; background: linear-gradient(to top, rgba(0,0,0,0.6) 0%, transparent 50%); }
    .highlight-label { position: absolute; bottom: 12px; left: 12px; right: 12px; color: #fff; font-size: 12px; font-weight: 600; z-index: 1; }

    .trust-container {
      padding: 24px 16px;
      margin: 0 16px 24px;
      background: var(--bg-secondary);
      border-radius: 16px;
      text-align: center;
      border: 1px solid var(--border);
    }

    .trust-number { font-size: 32px; font-weight: 800; color: var(--accent); margin-bottom: 4px; }
    .trust-label { font-size: 13px; color: var(--text-secondary); }

    .contact-container { padding: 0 16px 32px; display: flex; gap: 12px; }

    .contact-button {
      flex: 1;
      height: 48px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;
      text-decoration: none;
    }

    .contact-button.primary { background: var(--accent); color: #fff; border: none; }
    .contact-button.primary:hover { background: var(--accent-hover); }
    .contact-button.secondary { background: transparent; color: var(--text); border: 1px solid var(--border); }
    .contact-button.secondary:hover { background: var(--bg-secondary); }
    .contact-button svg { width: 18px; height: 18px; }

    .bottom-nav {
      position: sticky;
      bottom: 0;
      height: 64px;
      background: var(--nav);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-top: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-around;
      padding: 0 16px;
    }

    .nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      padding: 8px 16px;
      border-radius: 12px;
      cursor: pointer;
      transition: all 0.15s;
    }

    .nav-item:hover { background: var(--bg-tertiary); }
    .nav-item.active { color: var(--accent); }
    .nav-item:not(.active) { color: var(--text-secondary); }
    .nav-item svg { width: 24px; height: 24px; }
    .nav-item span { font-size: 11px; font-weight: 500; }

    .footer { padding: 24px 16px 32px; text-align: center; }
    .footer-text { font-size: 12px; color: var(--text-tertiary); display: flex; align-items: center; justify-content: center; gap: 4px; }
    .footer-heart { color: #F4212E; }

    /* Description */
    .palette-info {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0,0,0,0.92);
      backdrop-filter: blur(20px);
      padding: 16px 24px;
      border-radius: 12px;
      max-width: 500px;
      text-align: center;
      z-index: 1000;
      border: 1px solid rgba(255,255,255,0.08);
    }

    .palette-info h3 { font-size: 16px; font-weight: 700; margin-bottom: 4px; }
    .palette-info p { font-size: 13px; color: #888; line-height: 1.5; }
    .palette-info .swatch { display: inline-flex; gap: 6px; margin-top: 8px; }
    .palette-info .swatch span { width: 20px; height: 20px; border-radius: 50%; border: 2px solid rgba(255,255,255,0.1); }

    @media (max-width: 860px) {
      .phone-frame { width: 100%; max-width: 390px; height: 700px; }
      .preview-container { padding-top: 160px; }
    }
  </style>
</head>
<body>
  <!-- Selector -->
  <div class="selector-bar">
    <div class="selector-inner">
      <div class="selector-header">
        <h2>Clean Slate — Color Palettes</h2>
        <div class="mode-toggle">
          <button class="mode-btn" onclick="switchMode('light')">Light</button>
          <button class="mode-btn active" onclick="switchMode('dark')">Dark</button>
        </div>
      </div>
      <div class="palette-tabs">
        <div class="palette-tab active" onclick="switchPalette('ocean')" style="--tab-color: #0EA5E9;">
          <span class="color-dot" style="background: #0EA5E9;"></span>
          1. Ocean Blue
        </div>
        <div class="palette-tab" onclick="switchPalette('emerald')" style="--tab-color: #10B981;">
          <span class="color-dot" style="background: #10B981;"></span>
          2. Emerald
        </div>
        <div class="palette-tab" onclick="switchPalette('violet')" style="--tab-color: #8B5CF6;">
          <span class="color-dot" style="background: #8B5CF6;"></span>
          3. Violet
        </div>
        <div class="palette-tab" onclick="switchPalette('rose')" style="--tab-color: #F43F5E;">
          <span class="color-dot" style="background: #F43F5E;"></span>
          4. Rose
        </div>
        <div class="palette-tab" onclick="switchPalette('teal')" style="--tab-color: #14B8A6;">
          <span class="color-dot" style="background: #14B8A6;"></span>
          5. Teal
        </div>
      </div>
    </div>
  </div>

  <!-- Info -->
  <div class="palette-info" id="palette-info">
    <h3 id="info-title" style="color: #0EA5E9;">Ocean Blue</h3>
    <p id="info-desc">Fresh, trustworthy, professional. The classic tech blue — clean and universally appealing.</p>
    <div class="swatch" id="info-swatches"></div>
  </div>

  <!-- Preview -->
  <div class="preview-container" id="preview-container">
    <!-- 5 phone frames generated by JS -->
  </div>

  <script>
    const palettes = {

    let currentMode = 'dark';

    const appHTML = `

          <div class="info-icon"><svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M15 10.5a3 3 0 11-6 0 3 3 0 016 0z" /><path stroke-linecap="round" stroke-linejoin="round" d="M19.5 10.5c0 7.142-7.5 11.25-7.5 11.25S4.5 17.642 4.5 10.5a7.5 7.5 0 1115 0z" /></svg></div>

          <span class="info-text" dir="ltr">0912 123 4567</span>

    // Build frames
    const container = document.getElementById('preview-container');
    Object.keys(palettes).forEach(key => {
      const frame = document.createElement('div');
      frame.className = 'phone-frame' + (key === 'ocean' ? '' : ' hidden');
      frame.id = 'frame-' + key;
      frame.innerHTML = `
        <div class="phone-content" data-palette="${key}" data-mode="${currentMode}">
          <div class="app" data-palette="${key}" data-mode="${currentMode}">${appHTML}</div>
        </div>
      `;
      container.appendChild(frame);
    });

    function switchPalette(palette) {
      currentPalette = palette;
      document.querySelectorAll('.palette-tab').forEach(t => t.classList.remove('active'));
      event.target.closest('.palette-tab').classList.add('active');

      document.querySelectorAll('.phone-frame').forEach(f => f.classList.add('hidden'));
      document.getElementById('frame-' + palette).classList.remove('hidden');

      const p = palettes[palette];
      document.getElementById('info-title').textContent = p.name;
      document.getElementById('info-title').style.color = p[currentMode].accent;
      document.getElementById('info-desc').textContent = p.desc;

      // Update swatches
      const swatchEl = document.getElementById('info-swatches');
      swatchEl.innerHTML = p.colors.map(c => `<span style="background:${c};"></span>`).join('');
    }

    function switchMode(mode) {
      currentMode = mode;
      document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
      event.target.classList.add('active');

      document.querySelectorAll('.phone-content').forEach(el => {
        el.setAttribute('data-mode', mode);
        el.querySelector('.app').setAttribute('data-mode', mode);
      });

      // Refresh info color
      const p = palettes[currentPalette];
      document.getElementById('info-title').style.color = p[mode].accent;
    }

    // Init swatches
    document.getElementById('info-swatches').innerHTML = palettes.ocean.colors.map(c => `<span style="background:${c};"></span>`).join('');
