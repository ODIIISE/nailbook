<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>انتخاب زمان — طرح خط‌زمان</title>
  <style>
    :root {
      --bg: #000000;
      --fg: #FAFAFA;
      --card: #0F0F10;
      --muted: #171717;
      --muted-fg: #B5B5B5;
      --border: #262626;
      --radius: 18px;
      --font: 'Vazirmatn', -apple-system, BlinkMacSystemFont, sans-serif;
    }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: var(--font); background: var(--bg); color: var(--fg); min-height: 100dvh; display: flex; justify-content: center; }
    .phone { width: 100%; max-width: 430px; padding: 16px; padding-bottom: 90px; }
    .header { display: flex; align-items: center; gap: 12px; margin-bottom: 20px; }
    .back { width: 36px; height: 36px; border-radius: 12px; background: var(--card); border: 1px solid var(--border); display: grid; place-items: center; color: var(--fg); }
    .title { font-size: 18px; font-weight: 700; }
    .subtitle { font-size: 13px; color: var(--muted-fg); }

    .days { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 12px; margin-bottom: 16px; scrollbar-width: none; }
    .days::-webkit-scrollbar { display: none; }
    .day { flex: 0 0 64px; height: 80px; border-radius: var(--radius); border: 1px solid var(--border); background: var(--card); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; cursor: pointer; }
    .day.active { background: var(--fg); color: var(--bg); border-color: var(--fg); }
    .day span { font-size: 11px; }
    .day strong { font-size: 18px; }

    .timeline { position: relative; padding-right: 24px; }
    .timeline::before { content: ''; position: absolute; right: 6px; top: 12px; bottom: 12px; width: 2px; background: var(--border); }

    .event { position: relative; padding-right: 28px; margin-bottom: 24px; }
    .event::before { content: ''; position: absolute; right: -18px; top: 14px; width: 10px; height: 10px; border-radius: 50%; background: var(--border); border: 2px solid var(--bg); }
    .event.selected::before { background: var(--fg); border-color: var(--fg); }

    .event-card { padding: 16px; border-radius: var(--radius); background: var(--card); border: 1px solid var(--border); cursor: pointer; }
    .event-card:hover, .event-card.selected { background: var(--muted); }
    .event-time { font-size: 16px; font-weight: 700; margin-bottom: 4px; }
    .event-label { font-size: 12px; color: var(--muted-fg); }

    .gap { position: relative; padding-right: 28px; margin: 16px 0; font-size: 12px; color: var(--muted-fg); }
    .gap::before { content: '···'; position: absolute; right: -4px; top: -4px; background: var(--bg); padding: 0 4px; }

    .cta { position: fixed; bottom: 16px; left: 16px; right: 16px; max-width: 398px; margin: 0 auto; height: 52px; border-radius: var(--radius); background: var(--fg); color: var(--bg); border: none; font-family: var(--font); font-size: 15px; font-weight: 700; cursor: pointer; }
  </style>
</head>
<body>
  <div class="phone">
    <div class="header">
      <div class="back">→</div>
      <div>
        <div class="title">انتخاب زمان</div>
        <div class="subtitle">ساعت مورد نظر را روی خط‌زمان انتخاب کنید</div>
      </div>
    </div>

    <div class="days">
      <div class="day"><span>شنبه</span><strong>۱۲</strong></div>
      <div class="day active"><span>یک‌ش</span><strong>۱۳</strong></div>
      <div class="day"><span>دوش</span><strong>۱</strong></div>
      <div class="day"><span>سه‌ش</span><strong>۱۵</strong></div>
    </div>

    <div class="timeline">
      <div class="event" onclick="select(this)">
        <div class="event-card">
          <div class="event-time">۱۰:۰۰</div>
          <div class="event-label">اولین ساعت آزاد</div>
        </div>
      </div>
      <div class="event" onclick="select(this)">
        <div class="event-card">
          <div class="event-time">۱۰:۳۰</div>
          <div class="event-label">صبح زود</div>
        </div>
      </div>
      <div class="gap">رزرو شده</div>
      <div class="event selected" onclick="select(this)">
        <div class="event-card selected">
          <div class="event-time">۱۶:۰۰</div>
          <div class="event-label">نزدیک‌ترین ساعت آزاد</div>
        </div>
      </div>
      <div class="event" onclick="select(this)">
        <div class="event-card">
          <div class="event-time">۱۶:۳۰</div>
          <div class="event-label">عصر</div>
        </div>
      </div>
      <div class="event" onclick="select(this)">
        <div class="event-card">
          <div class="event-time">۱:۰۰</div>
          <div class="event-label">پایان روز</div>
        </div>
      </div>
    </div>

    <button class="cta">ادامه با ۱۶:۰۰</button>
  </div>
  <script>
    function select(el) { document.querySelectorAll('.event').forEach(e => { e.classList.remove('selected'); e.querySelector('.event-card').classList.remove('selected'); }); el.classList.add('selected'); el.querySelector('.event-card').classList.add('selected'); }
  </script>
</body>
</html>
