<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>انتخاب زمان — طرح چرخشی</title>
  <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/fonts/webfonts/Vazirmatn-Regular.woff2" rel="stylesheet" as="font" type="font/woff2" crossorigin />
  <style>
    :root {
      --bg: #000000;
      --fg: #FAFAFA;
      --card: #0F0F10;
      --muted: #171717;
      --muted-fg: #B5B5B5;
      --border: #262626;
      --radius: 18px;
      --font: 'Vazirmatn', -apple-system, BlinkMacSystemFont, sans-serif;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: var(--font);
      background: var(--bg);
      color: var(--fg);
      min-height: 100dvh;
      display: flex;
      justify-content: center;
    }
    .phone { width: 100%; max-width: 430px; padding: 16px; }
    .header { display: flex; align-items: center; gap: 12px; margin-bottom: 20px; }
    .back { width: 36px; height: 36px; border-radius: 12px; background: var(--card); border: 1px solid var(--border); display: grid; place-items: center; color: var(--fg); }
    .title { font-size: 18px; font-weight: 700; }
    .subtitle { font-size: 13px; color: var(--muted-fg); }

    .days { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 12px; margin-bottom: 16px; scrollbar-width: none; }
    .days::-webkit-scrollbar { display: none; }
    .day {
      flex: 0 0 64px; height: 80px; border-radius: var(--radius); border: 1px solid var(--border);
      background: var(--card); display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 6px; cursor: pointer;
    }
    .day.active { background: var(--fg); color: var(--bg); border-color: var(--fg); }
    .day span { font-size: 11px; }
    .day strong { font-size: 18px; }

    .selected-date { text-align: center; padding: 16px 0 8px; }
    .selected-date .label { font-size: 13px; color: var(--muted-fg); margin-bottom: 4px; }
    .selected-date .value { font-size: 20px; font-weight: 700; }

    .wheel-container {
      position: relative; height: 280px; margin: 24px 0; border-radius: var(--radius);
      background: var(--card); border: 1px solid var(--border); overflow: hidden;
    }
    .wheel-center {
      position: absolute; top: 50%; left: 0; right: 0; transform: translateY(-50%);
      height: 52px; border-top: 1px solid var(--border); border-bottom: 1px solid var(--border);
      pointer-events: none; z-index: 2;
    }
    .wheel {
      height: 100%; overflow-y: auto; scroll-snap-type: y mandatory; padding: 112px 0;
      scrollbar-width: none; -ms-overflow-style: none;
    }
    .wheel::-webkit-scrollbar { display: none; }
    .wheel-item {
      height: 52px; display: flex; align-items: center; justify-content: center;
      font-size: 16px; color: var(--muted-fg); scroll-snap-align: center;
      transition: all 0.15s ease;
    }
    .wheel-item.active { font-size: 24px; font-weight: 700; color: var(--fg); }

    .cta {
      position: fixed; bottom: 16px; left: 16px; right: 16px; max-width: 398px; margin: 0 auto;
      height: 52px; border-radius: var(--radius); background: var(--fg); color: var(--bg);
      border: none; font-family: var(--font); font-size: 15px; font-weight: 700; cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="phone">
    <div class="header">
      <div class="back">→</div>
      <div>
        <div class="title">انتخاب زمان</div>
        <div class="subtitle">۱ ساعت برای رزرو انتخاب کنید</div>
      </div>
    </div>

    <div class="days">
      <div class="day"><span>شنبه</span><strong>۱۲</strong></div>
      <div class="day active"><span>یک‌ش</span><strong>۱۳</strong></div>
      <div class="day"><span>دوش</span><strong>۱۴</strong></div>
      <div class="day"><span>سه‌ش</span><strong>۱۵</strong></div>
      <div class="day"><span>چهار</span><strong>۱۶</strong></div>
    </div>

    <div class="selected-date">
      <div class="label">تاریخ انتخاب‌شده</div>
      <div class="value">دوشنبه، ۱۴ مرداد ۱۴۰۵</div>
    </div>

    <div class="wheel-container">
      <div class="wheel-center"></div>
      <div class="wheel">
        <div class="wheel-item">۱۵:۳۰</div>
        <div class="wheel-item">۱۵:۴۵</div>
        <div class="wheel-item active">۱۶:۰۰</div>
        <div class="wheel-item">۱۶:۱۵</div>
        <div class="wheel-item">۱۶:۳۰</div>
        <div class="wheel-item">۱۶:۴۵</div>
        <div class="wheel-item">۱:۰۰</div>
        <div class="wheel-item">۱:۱۵</div>
      </div>
    </div>

    <button class="cta">ادامه با ۱۶:۰۰</button>
  </div>
</body>
</html>
