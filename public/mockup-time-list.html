<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>انتخاب زمان — طرح لیستی</title>
  <style>
    :root {
      --bg: #000000;
      --fg: #FAFAFA;
      --card: #0F0F10;
      --muted: #171717;
      --muted-fg: #B5B5B5;
      --border: #262626;
      --radius: 18px;
      --font: 'Vazirmatn', -apple-system, BlinkMacSystemFont, sans-serif;
    }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: var(--font); background: var(--bg); color: var(--fg); min-height: 100dvh; display: flex; justify-content: center; }
    .phone { width: 100%; max-width: 430px; padding: 16px; }
    .header { display: flex; align-items: center; gap: 12px; margin-bottom: 20px; }
    .back { width: 36px; height: 36px; border-radius: 12px; background: var(--card); border: 1px solid var(--border); display: grid; place-items: center; color: var(--fg); }
    .title { font-size: 18px; font-weight: 700; }
    .subtitle { font-size: 13px; color: var(--muted-fg); }

    .days { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 12px; margin-bottom: 16px; scrollbar-width: none; }
    .days::-webkit-scrollbar { display: none; }
    .day { flex: 0 0 64px; height: 80px; border-radius: var(--radius); border: 1px solid var(--border); background: var(--card); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; cursor: pointer; }
    .day.active { background: var(--fg); color: var(--bg); border-color: var(--fg); }
    .day span { font-size: 11px; }
    .day strong { font-size: 18px; }

    .section-title { font-size: 13px; color: var(--muted-fg); margin: 20px 0 10px; padding-right: 4px; }
    .slot-row { display: flex; align-items: center; justify-content: space-between; padding: 16px; border-radius: var(--radius); background: var(--card); border: 1px solid var(--border); margin-bottom: 10px; cursor: pointer; transition: background 0.15s; }
    .slot-row:hover, .slot-row.selected { background: var(--muted); }
    .slot-time { font-size: 18px; font-weight: 700; }
    .slot-meta { font-size: 12px; color: var(--muted-fg); margin-top: 4px; }
    .slot-select { font-size: 13px; font-weight: 700; padding: 8px 18px; border-radius: 14px; background: var(--fg); color: var(--bg); }
    .slot-row.selected .slot-select { background: var(--bg); color: var(--fg); }

    .cta { position: fixed; bottom: 16px; left: 16px; right: 16px; max-width: 398px; margin: 0 auto; height: 52px; border-radius: var(--radius); background: var(--fg); color: var(--bg); border: none; font-family: var(--font); font-size: 15px; font-weight: 700; cursor: pointer; }
  </style>
</head>
<body>
  <div class="phone">
    <div class="header">
      <div class="back">→</div>
      <div>
        <div class="title">انتخاب زمان</div>
        <div class="subtitle">لیست ساعات خالی امروز</div>
      </div>
    </div>

    <div class="days">
      <div class="day"><span>شنبه</span><strong>۱۲</strong></div>
      <div class="day active"><span>یک‌ش</span><strong>۱۳</strong></div>
      <div class="day"><span>دوش</span><strong>۱۴</strong></div>
      <div class="day"><span>سه‌ش</span><strong>۱۵</strong></div>
      <div class="day"><span>چهار</span><strong>۱</strong></div>
    </div>

    <div class="section-title">صبح</div>
    <div class="slot-row" onclick="select(this)">
      <div><div class="slot-time">۱۰:۰۰</div><div class="slot-meta">زمان کافی برای مانیکور</div></div>
      <div class="slot-select">انتخاب</div>
    </div>
    <div class="slot-row" onclick="select(this)">
      <div><div class="slot-time">۱۰:۳۰</div><div class="slot-meta">پیشنهاد ما برای شروع روز</div></div>
      <div class="slot-select">انتخاب</div>
    </div>

    <div class="section-title">عصر</div>
    <div class="slot-row selected" onclick="select(this)">
      <div><div class="slot-time">۱۶:۰۰</div><div class="slot-meta">نزدیک‌ترین ساعت آزاد</div></div>
      <div class="slot-select">انتخاب</div>
    </div>
    <div class="slot-row" onclick="select(this)">
      <div><div class="slot-time">۱۶:۳۰</div><div class="slot-meta">زمان کافی برای کاشت</div></div>
      <div class="slot-select">انتخاب</div>
    </div>
    <div class="slot-row" onclick="select(this)">
      <div><div class="slot-time">۱:۰۰</div><div class="slot-meta">آخرین ساعت آزاد</div></div>
      <div class="slot-select">انتخاب</div>
    </div>

    <button class="cta">ادامه با ۱۶:۰۰</button>
  </div>
  <script>
    function select(el) { document.querySelectorAll('.slot-row').forEach(r => r.classList.remove('selected')); el.classList.add('selected'); }
  </script>
</body>
</html>
