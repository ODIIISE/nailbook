<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wheel Picker — Time Selection</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;700;800&display=swap" rel="stylesheet">
  <style>
    :root { --bg: #000000; --fg: #FAFAFA; --card: #0F0F10; --border: #262626; --muted: #B5B5B5; --radius: 18px; }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body { margin: 0; font-family: 'Vazirmatn', sans-serif; background: var(--bg); color: var(--fg); min-height: 100dvh; padding: 24px 16px 120px; max-width: 430px; margin-inline: auto; }
    .header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; }
    .back { width: 40px; height: 40px; display: grid; place-items: center; border-radius: 12px; background: var(--card); border: 1px solid var(--border); color: var(--fg); }
    .title { font-size: 18px; font-weight: 800; }
    .subtitle { font-size: 13px; color: var(--muted); }

    .days { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 8px; margin-bottom: 16px; scrollbar-width: none; }
    .days::-webkit-scrollbar { display: none; }
    .day { flex: 0 0 64px; height: 72px; border-radius: var(--radius); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; background: var(--card); border: 1px solid var(--border); color: var(--muted); }
    .day.active { background: var(--fg); color: var(--bg); border-color: var(--fg); }
    .day .dow { font-size: 11px; font-weight: 500; }
    .day .num { font-size: 17px; font-weight: 800; }

    .wheel-frame { position: relative; height: 320px; margin: 40px 0; border-radius: var(--radius); background: var(--card); border: 1px solid var(--border); overflow: hidden; }
    .wheel-center { position: absolute; top: 50%; left: 0; right: 0; height: 64px; transform: translateY(-50%); border-top: 1px solid var(--fg); border-bottom: 1px solid var(--fg); background: rgba(250,250,250,0.04); pointer-events: none; z-index: 2; }
    .wheel { height: 100%; overflow-y: auto; scroll-snap-type: y mandatory; scrollbar-width: none; padding: 128px 0; }
    .wheel::-webkit-scrollbar { display: none; }
    .wheel-item { height: 64px; display: flex; align-items: center; justify-content: center; font-size: 28px; font-weight: 800; color: var(--muted); scroll-snap-align: center; transition: color .2s; cursor: pointer; }
    .wheel-item.active { color: var(--fg); font-size: 34px; }
    .wheel-shadow-top { position: absolute; top: 0; left: 0; right: 0; height: 90px; background: linear-gradient(to bottom, var(--card), transparent); pointer-events: none; z-index: 1; }
    .wheel-shadow-bottom { position: absolute; bottom: 0; left: 0; right: 0; height: 90px; background: linear-gradient(to top, var(--card), transparent); pointer-events: none; z-index: 1; }

    .selected-card { text-align: center; margin-bottom: 24px; }
    .selected-label { font-size: 13px; color: var(--muted); margin-bottom: 6px; }
    .selected-time { font-size: 24px; font-weight: 800; }

    .bottom { position: fixed; bottom: 0; left: 0; right: 0; max-width: 430px; margin-inline: auto; padding: 16px; background: linear-gradient(to top, var(--bg) 80%, transparent); }
    .btn { width: 100%; height: 52px; border-radius: var(--radius); border: none; background: var(--fg); color: var(--bg); font-family: inherit; font-size: 15px; font-weight: 800; cursor: pointer; }
    .btn:disabled { opacity: .35; cursor: not-allowed; }
  </style>
</head>
<body>
  <div class="header">
    <div class="back">→</div>
    <div><div class="title">انتخاب زمان</div><div class="subtitle">مانیکور ناخن طبیعی</div></div>
    <div style="width:40px"></div>
  </div>

  <div class="days">
    <div class="day"><span class="dow">شنبه</span><span class="num">۱۲</span></div>
    <div class="day active"><span class="dow">یک‌شنبه</span><span class="num">۱۳</span></div>
    <div class="day"><span class="dow">دوشنبه</span><span class="num">۱۴</span></div>
    <div class="day"><span class="dow">سه‌شنبه</span><span class="num">۱۵</span></div>
  </div>

  <div class="selected-card">
    <div class="selected-label">ساعت انتخاب‌شده</div>
    <div class="selected-time" id="selectedTime">۱۵:۴۵</div>
  </div>

  <div class="wheel-frame">
    <div class="wheel-shadow-top"></div>
    <div class="wheel-shadow-bottom"></div>
    <div class="wheel-center"></div>
    <div class="wheel" id="wheel">
      <div class="wheel-item" data-time="۱۰:۳۰">۱۰:۳۰</div>
      <div class="wheel-item" data-time="۱۱:۴۵">۱۱:۴۵</div>
      <div class="wheel-item active" data-time="۱:۴۵">۱۵:۴۵</div>
      <div class="wheel-item" data-time="۱۷:۰۰">۱۷:۰۰</div>
      <div class="wheel-item" data-time="۱:۱۵">۱۸:۱۵</div>
      <div class="wheel-item" data-time="۱۹:۳۰">۱۹:۳۰</div>
    </div>
  </div>

  <div class="bottom"><button class="btn" id="continue">ادامه</button></div>

  <script>
    const wheel = document.getElementById('wheel');
    const items = wheel.querySelectorAll('.wheel-item');
    const selectedDisplay = document.getElementById('selectedTime');
    const io = new IntersectionObserver((entries) => { entries.forEach(e => { if (e.isIntersecting) { items.forEach(i => i.classList.remove('active')); e.target.classList.add('active'); selectedDisplay.textContent = e.target.dataset.time; } }); }, { root: wheel, threshold: 0.6 });
    items.forEach(i => io.observe(i));
  </script>
</body>
</html>
