<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smart Suggestion — Time Selection</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;700;800&display=swap" rel="stylesheet">
  <style>
    :root { --bg: #000000; --fg: #FAFAFA; --card: #0F0F10; --border: #262626; --muted: #B5B5B5; --radius: 18px; }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body { margin: 0; font-family: 'Vazirmatn', sans-serif; background: var(--bg); color: var(--fg); min-height: 100dvh; padding: 24px 16px 120px; max-width: 430px; margin-inline: auto; }
    .header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; }
    .back { width: 40px; height: 40px; display: grid; place-items: center; border-radius: 12px; background: var(--card); border: 1px solid var(--border); color: var(--fg); }
    .title { font-size: 18px; font-weight: 800; }
    .subtitle { font-size: 13px; color: var(--muted); }

    .days { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 8px; margin-bottom: 24px; scrollbar-width: none; }
    .days::-webkit-scrollbar { display: none; }
    .day { flex: 0 0 64px; height: 72px; border-radius: var(--radius); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; background: var(--card); border: 1px solid var(--border); color: var(--muted); }
    .day.active { background: var(--fg); color: var(--bg); border-color: var(--fg); }
    .day .dow { font-size: 11px; font-weight: 500; }
    .day .num { font-size: 17px; font-weight: 800; }

    .label { text-align: center; font-size: 13px; color: var(--muted); margin-bottom: 12px; }

    .big-card {
      background: var(--fg); color: var(--bg); border-radius: var(--radius); padding: 32px 24px; text-align: center;
      margin-bottom: 16px; cursor: pointer; transition: transform .15s;
    }
    .big-card:active { transform: scale(0.98); }
    .big-card-label { font-size: 13px; opacity: .7; margin-bottom: 8px; }
    .big-card-time { font-size: 56px; font-weight: 800; margin-bottom: 8px; letter-spacing: -0.02em; }
    .big-card-sub { font-size: 14px; opacity: .7; }

    .alt-link { display: block; text-align: center; color: var(--muted); font-size: 14px; padding: 12px; cursor: pointer; margin-bottom: 24px; }

    .alt-list { display: none; border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; background: var(--card); margin-bottom: 24px; }
    .alt-list-header { padding: 14px 16px; border-bottom: 1px solid var(--border); font-size: 14px; font-weight: 700; }
    .alt-item { padding: 14px 16px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; cursor: pointer; }
    .alt-item:last-child { border-bottom: none; }
    .alt-item:hover { background: rgba(250,250,250,0.03); }
    .alt-item.selected { background: var(--fg); color: var(--bg); }

    .bottom { position: fixed; bottom: 0; left: 0; right: 0; max-width: 430px; margin-inline: auto; padding: 16px; background: linear-gradient(to top, var(--bg) 80%, transparent); }
    .btn { width: 100%; height: 52px; border-radius: var(--radius); border: none; background: var(--fg); color: var(--bg); font-family: inherit; font-size: 15px; font-weight: 800; cursor: pointer; }
    .btn:disabled { opacity: .35; cursor: not-allowed; }
  </style>
</head>
<body>
  <div class="header">
    <div class="back">→</div>
    <div><div class="title">انتخاب زمان</div><div class="subtitle">مانیکور ناخن طبیعی</div></div>
    <div style="width:40px"></div>
  </div>

  <div class="days">
    <div class="day"><span class="dow">شنبه</span><span class="num">۱۲</span></div>
    <div class="day active"><span class="dow">یک‌شنبه</span><span class="num">۱۳</span></div>
    <div class="day"><span class="dow">دوشنبه</span><span class="num">۱۴</span></div>
    <div class="day"><span class="dow">سه‌شنبه</span><span class="num">۱۵</span></div>
  </div>

  <div class="label">بهترین زمان برای امروز</div>

  <div class="big-card" onclick="selectMain()">
    <div class="big-card-label">نزدیک‌ترین ساعت آزاد</div>
    <div class="big-card-time">۱۵:۴۵</div>
    <div class="big-card-sub">عصر · ۶۰ دقیقه</div>
  </div>

  <div class="alt-link" onclick="toggleAlts()">مشاهدهٔ ساعت‌های دیگر</div>

  <div class="alt-list" id="altList">
    <div class="alt-list-header">۴ ساعت دیگر</div>
    <div class="alt-item" onclick="pickAlt(this, '۱۷:۰۰')">۱۷:۰۰</div>
    <div class="alt-item" onclick="pickAlt(this, '۱۸:۱۵')">۱۸:۱۵</div>
    <div class="alt-item" onclick="pickAlt(this, '۱۹:۳۰')">۱۹:۳۰</div>
  </div>

  <div class="bottom"><button class="btn" id="continue">ادامه</button></div>

  <script>
    let mainSelected = true;
    function selectMain() { mainSelected = true; document.querySelectorAll('.alt-item').forEach(i => i.classList.remove('selected')); document.getElementById('continue').textContent = 'ادامه با ۱۵:۴۵'; }
    function toggleAlts() { const el = document.getElementById('altList'); el.style.display = el.style.display === 'block' ? 'none' : 'block'; }
    function pickAlt(el, time) { document.querySelectorAll('.alt-item').forEach(i => i.classList.remove('selected')); el.classList.add('selected'); mainSelected = false; document.getElementById('continue').textContent = 'ادامه با ' + time; }
  </script>
</body>
</html>
