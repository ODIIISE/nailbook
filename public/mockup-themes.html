<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forehand Nail Studio - 5 Theme Options</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Playfair+Display:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: #0a0a0a;
      color: #fff;
      min-height: 100vh;
    }

    /* Theme Selector Bar */
    .theme-selector {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 1000;
      background: rgba(0, 0, 0, 0.9);
      backdrop-filter: blur(20px);
      border-bottom: 1px solid rgba(255,255,255,0.1);
      padding: 16px 24px;
    }

    .theme-selector-inner {
      max-width: 1400px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }

    .theme-selector h2 {
      font-size: 18px;
      font-weight: 700;
      white-space: nowrap;
    }

    .theme-tabs {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: center;
    }

    .theme-tab {
      padding: 10px 20px;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
      border: 2px solid transparent;
      background: rgba(255,255,255,0.05);
      color: #888;
    }

    .theme-tab:hover {
      background: rgba(255,255,255,0.1);
      color: #fff;
    }

    .theme-tab.active {
      background: var(--accent, #1D9BF0);
      color: #fff;
      border-color: var(--accent, #1D9BF0);
    }

    /* Preview Container */
    .preview-container {
      padding-top: 100px;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      gap: 40px;
      padding-left: 40px;
      padding-right: 40px;
      flex-wrap: wrap;
    }

    /* Phone Frame */
    .phone-frame {
      width: 390px;
      height: 844px;
      border-radius: 40px;
      overflow: hidden;
      box-shadow: 0 25px 80px rgba(0,0,0,0.5), 0 0 0 8px #1a1a1a;
      position: relative;
      flex-shrink: 0;
    }

    .phone-frame.hidden { display: none; }

    .phone-content {
      width: 100%;
      height: 100%;
      overflow-y: auto;
      overflow-x: hidden;
      scrollbar-width: none;
    }

    .phone-content::-webkit-scrollbar { display: none; }

    /* Theme Label */
    .theme-label {
      position: absolute;
      top: -40px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0,0,0,0.8);
      padding: 8px 16px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 600;
      white-space: nowrap;
      color: #fff;
    }

    /* ============ THEME 1: CLEAN SLATE ============ */
    [data-theme="clean-slate"] {
      --bg: #FFFFFF;
      --bg-secondary: #F8FAFC;
      --bg-tertiary: #F1F5F9;
      --text: #0F172A;
      --text-secondary: #64748B;
      --text-tertiary: #94A3B8;
      --border: #E2E8F0;
      --border-light: #F1F5F9;
      --accent: #1D9BF0;
      --accent-hover: #1A8CD8;
      --accent-light: rgba(29, 155, 240, 0.1);
      --card: #FFFFFF;
      --nav: rgba(255,255,255,0.9);
    }

    /* ============ THEME 2: SOFT LUXURY ============ */
    [data-theme="soft-luxury"] {
      --bg: #FAFAF9;
      --bg-secondary: #F5F5F4;
      --bg-tertiary: #E7E5E4;
      --text: #1C1917;
      --text-secondary: #78716C;
      --text-tertiary: #A8A29E;
      --border: #E7E5E4;
      --border-light: #F5F5F4;
      --accent: #3B82F6;
      --accent-hover: #2563EB;
      --accent-light: rgba(59, 130, 246, 0.08);
      --card: #FFFFFF;
      --nav: rgba(250,250,249,0.92);
    }

    /* ============ THEME 3: EDITORIAL BOLD ============ */
    [data-theme="editorial-bold"] {
      --bg: #FFFFFF;
      --bg-secondary: #FAFAFA;
      --bg-tertiary: #F0F0F0;
      --text: #000000;
      --text-secondary: #525252;
      --text-tertiary: #A3A3A3;
      --border: #E5E5E5;
      --border-light: #F5F5F5;
      --accent: #1D9BF0;
      --accent-hover: #1A8CD8;
      --accent-light: rgba(29, 155, 240, 0.08);
      --card: #FFFFFF;
      --nav: rgba(255,255,255,0.95);
    }

    /* ============ THEME 4: GLASS REFINED ============ */
    [data-theme="glass-refined"] {
      --bg: #F8FAFC;
      --bg-secondary: rgba(255,255,255,0.6);
      --bg-tertiary: rgba(255,255,255,0.4);
      --text: #0F172A;
      --text-secondary: #64748B;
      --text-tertiary: #94A3B8;
      --border: rgba(255,255,255,0.8);
      --border-light: rgba(255,255,255,0.5);
      --accent: #6366F1;
      --accent-hover: #4F46E5;
      --accent-light: rgba(99, 102, 241, 0.1);
      --card: rgba(255,255,255,0.7);
      --nav: rgba(255,255,255,0.75);
      --shadow-card: 0 4px 24px rgba(0,0,0,0.06), 0 1px 2px rgba(0,0,0,0.04);
    }

    /* ============ THEME 5: DARK ELEGANCE ============ */
    [data-theme="dark-elegance"] {
      --bg: #09090B;
      --bg-secondary: #18181B;
      --bg-tertiary: #27272A;
      --text: #FAFAFA;
      --text-secondary: #A1A1AA;
      --text-tertiary: #71717A;
      --border: #27272A;
      --border-light: #1F1F23;
      --accent: #D4A574;
      --accent-hover: #C9956A;
      --accent-light: rgba(212, 165, 116, 0.12);
      --card: #18181B;
      --nav: rgba(9,9,11,0.92);
    }

    /* ============ SHARED STYLES ============ */
    .app {
      min-height: 100%;
      background: var(--bg);
      color: var(--text);
      transition: background 0.3s, color 0.3s;
    }

    .header {
      position: sticky;
      top: 0;
      z-index: 100;
      background: var(--nav);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--border);
      height: 56px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
    }

    .header-brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .header-logo {
      width: 32px;
      height: 32px;
      background: var(--accent);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .header-logo svg { width: 18px; height: 18px; color: #fff; }

    .header-title {
      font-size: 15px;
      font-weight: 700;
    }

    .header-menu {
      width: 40px;
      height: 40px;
      border-radius: 9999px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: background 0.15s;
    }

    .header-menu:hover { background: var(--bg-tertiary); }
    .header-menu svg { width: 20px; height: 20px; color: var(--text); }

    /* Hero */
    .hero {
      padding: 32px 16px 24px;
      text-align: center;
    }

    .hero-avatar {
      width: 80px;
      height: 80px;
      border-radius: 20px;
      background: var(--bg-tertiary);
      margin: 0 auto 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 2px solid var(--border);
    }

    .hero-avatar svg { width: 40px; height: 40px; color: var(--text-tertiary); }

    .hero-name {
      font-size: 28px;
      font-weight: 800;
      margin-bottom: 4px;
      letter-spacing: -0.02em;
    }

    .hero-slogan {
      font-size: 15px;
      font-weight: 500;
      color: var(--accent);
      margin-bottom: 8px;
    }

    .hero-desc {
      font-size: 14px;
      color: var(--text-secondary);
      max-width: 320px;
      margin: 0 auto 20px;
      line-height: 1.6;
    }

    /* Info Card */
    .info-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 16px;
      margin: 0 16px 24px;
      box-shadow: var(--shadow-card, 0 1px 3px rgba(0,0,0,0.06));
    }

    .info-row {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 0;
    }

    .info-row:not(:last-child) { border-bottom: 1px solid var(--border-light); }

    .info-icon {
      width: 36px;
      height: 36px;
      border-radius: 10px;
      background: var(--accent-light);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .info-icon svg { width: 18px; height: 18px; color: var(--accent); }
    .info-text { font-size: 14px; }

    /* CTA Button */
    .cta-container { padding: 0 16px 32px; }

    .cta-button {
      width: 100%;
      height: 56px;
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 14px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: all 0.2s;
    }

    .cta-button:hover { background: var(--accent-hover); transform: translateY(-1px); }
    .cta-button svg { width: 20px; height: 20px; transform: scaleX(-1); }

    /* Section Header */
    .section-header { padding: 0 16px; margin-bottom: 16px; }
    .section-title { font-size: 20px; font-weight: 700; }

    /* Service Cards */
    .services-container { padding: 0 16px 32px; }

    .service-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 16px;
      margin-bottom: 12px;
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      gap: 16px;
      box-shadow: var(--shadow-card, 0 1px 3px rgba(0,0,0,0.06));
    }

    .service-card:hover { border-color: var(--accent); }

    .service-image {
      width: 64px;
      height: 64px;
      border-radius: 12px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .service-image svg { width: 28px; height: 28px; color: #fff; }

    .service-info { flex: 1; min-width: 0; }
    .service-name { font-size: 15px; font-weight: 600; margin-bottom: 2px; }
    .service-desc { font-size: 13px; color: var(--text-secondary); margin-bottom: 8px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    .service-meta { display: flex; align-items: center; gap: 12px; }

    .service-meta-item {
      display: flex;
      align-items: center;
      gap: 4px;
      font-size: 12px;
      color: var(--text-secondary);
    }

    .service-meta-item svg { width: 14px; height: 14px; }
    .service-meta-item.price { color: var(--accent); font-weight: 600; }

    .service-arrow { width: 20px; height: 20px; color: var(--text-tertiary); flex-shrink: 0; }

    /* Highlights */
    .highlights-container { padding: 0 16px 32px; }

    .highlights-scroll {
      display: flex;
      gap: 12px;
      overflow-x: auto;
      padding-bottom: 8px;
      scrollbar-width: none;
    }

    .highlights-scroll::-webkit-scrollbar { display: none; }

    .highlight-card {
      width: 120px;
      height: 160px;
      border-radius: 16px;
      flex-shrink: 0;
      cursor: pointer;
      position: relative;
      overflow: hidden;
      transition: transform 0.2s;
    }

    .highlight-card:hover { transform: scale(1.02); }

    .highlight-card::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(to top, rgba(0,0,0,0.6) 0%, transparent 50%);
    }

    .highlight-label {
      position: absolute;
      bottom: 12px;
      left: 12px;
      right: 12px;
      color: #fff;
      font-size: 12px;
      font-weight: 600;
      z-index: 1;
    }

    /* Trust */
    .trust-container {
      padding: 24px 16px;
      margin: 0 16px 24px;
      background: var(--bg-secondary);
      border-radius: 16px;
      text-align: center;
      border: 1px solid var(--border);
    }

    .trust-number { font-size: 32px; font-weight: 800; color: var(--accent); margin-bottom: 4px; }
    .trust-label { font-size: 13px; color: var(--text-secondary); }

    /* Contact */
    .contact-container { padding: 0 16px 32px; display: flex; gap: 12px; }

    .contact-button {
      flex: 1;
      height: 48px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;
      text-decoration: none;
    }

    .contact-button.primary { background: var(--accent); color: #fff; border: none; }
    .contact-button.primary:hover { background: var(--accent-hover); }
    .contact-button.secondary { background: transparent; color: var(--text); border: 1px solid var(--border); }
    .contact-button.secondary:hover { background: var(--bg-secondary); }
    .contact-button svg { width: 18px; height: 18px; }

    /* Bottom Nav */
    .bottom-nav {
      position: sticky;
      bottom: 0;
      height: 64px;
      background: var(--nav);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-top: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-around;
      padding: 0 16px;
    }

    .nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      padding: 8px 16px;
      border-radius: 12px;
      cursor: pointer;
      transition: all 0.15s;
    }

    .nav-item:hover { background: var(--bg-tertiary); }
    .nav-item.active { color: var(--accent); }
    .nav-item:not(.active) { color: var(--text-secondary); }
    .nav-item svg { width: 24px; height: 24px; }
    .nav-item span { font-size: 11px; font-weight: 500; }

    /* Footer */
    .footer { padding: 24px 16px 32px; text-align: center; }
    .footer-text { font-size: 12px; color: var(--text-tertiary); display: flex; align-items: center; justify-content: center; gap: 4px; }
    .footer-heart { color: #F4212E; }

    /* ============ THEME-SPECIFIC OVERRIDES ============ */

    /* Editorial Bold - bolder typography */
    [data-theme="editorial-bold"] .hero-name { font-size: 32px; font-weight: 800; letter-spacing: -0.03em; }
    [data-theme="editorial-bold"] .section-title { font-size: 22px; font-weight: 800; letter-spacing: -0.02em; }
    [data-theme="editorial-bold"] .service-name { font-weight: 700; }

    /* Glass Refined - glassmorphism */
    [data-theme="glass-refined"] .info-card,
    [data-theme="glass-refined"] .service-card,
    [data-theme="glass-refined"] .trust-container {
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
    }

    [data-theme="glass-refined"] .cta-button {
      background: linear-gradient(135deg, #818CF8 0%, #6366F1 100%);
      box-shadow: 0 4px 16px rgba(99, 102, 241, 0.3);
    }

    /* Dark Elegance - gold accents */
    [data-theme="dark-elegance"] .cta-button {
      background: linear-gradient(135deg, #D4A574 0%, #B8956A 100%);
      color: #09090B;
      box-shadow: 0 4px 16px rgba(212, 165, 116, 0.25);
    }

    [data-theme="dark-elegance"] .highlight-card::after {
      background: linear-gradient(to top, rgba(9,9,11,0.8) 0%, transparent 60%);
    }

    /* Description List */
    .theme-description {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0,0,0,0.9);
      backdrop-filter: blur(20px);
      padding: 16px 24px;
      border-radius: 12px;
      max-width: 600px;
      text-align: center;
      z-index: 1000;
    }

    .theme-description h3 {
      font-size: 16px;
      font-weight: 700;
      margin-bottom: 4px;
      color: var(--accent, #1D9BF0);
    }

    .theme-description p {
      font-size: 13px;
      color: #888;
      line-height: 1.5;
    }

    /* Responsive */
    @media (max-width: 1200px) {
      .preview-container { gap: 24px; padding: 100px 16px 24px; }
    }

    @media (max-width: 860px) {
      .phone-frame { width: 100%; max-width: 390px; height: 700px; }
    }
  </style>
</head>
<body>
  <!-- Theme Selector -->
  <div class="theme-selector">
    <div class="theme-selector-inner">
      <h2>Forehand Nail — Theme Preview</h2>
      <div class="theme-tabs">
        <div class="theme-tab active" onclick="switchTheme('clean-slate')" style="--accent: #1D9BF0;">1. Clean Slate</div>
        <div class="theme-tab" onclick="switchTheme('soft-luxury')" style="--accent: #3B82F6;">2. Soft Luxury</div>
        <div class="theme-tab" onclick="switchTheme('editorial-bold')" style="--accent: #1D9BF0;">3. Editorial Bold</div>
        <div class="theme-tab" onclick="switchTheme('glass-refined')" style="--accent: #6366F1;">4. Glass Refined</div>
        <div class="theme-tab" onclick="switchTheme('dark-elegance')" style="--accent: #D4A574;">5. Dark Elegance</div>
      </div>
    </div>
  </div>

  <!-- Theme Description -->
  <div class="theme-description" id="theme-desc">
    <h3 id="desc-title">Clean Slate</h3>
    <p id="desc-text">Pure white/dark backgrounds, subtle gray borders, blue CTAs. Like Linear/Vercel — ultra-clean, professional, content-first.</p>
  </div>

  <!-- Preview -->
  <div class="preview-container">
    <!-- All 5 phone frames -->
    <div class="phone-frame" id="frame-clean-slate">
      <div class="phone-content" data-theme="clean-slate">
        <div class="app" data-theme="clean-slate"></div>
      </div>
    </div>
    <div class="phone-frame hidden" id="frame-soft-luxury">
      <div class="phone-content" data-theme="soft-luxury">
        <div class="app" data-theme="soft-luxury"></div>
      </div>
    </div>
    <div class="phone-frame hidden" id="frame-editorial-bold">
      <div class="phone-content" data-theme="editorial-bold">
        <div class="app" data-theme="editorial-bold"></div>
      </div>
    </div>
    <div class="phone-frame hidden" id="frame-glass-refined">
      <div class="phone-content" data-theme="glass-refined">
        <div class="app" data-theme="glass-refined"></div>
      </div>
    </div>
    <div class="phone-frame hidden" id="frame-dark-elegance">
      <div class="phone-content" data-theme="dark-elegance">
        <div class="app" data-theme="dark-elegance"></div>
      </div>
    </div>
  </div>

  <script>
    const themes = {
      'clean-slate': {
        name: 'Clean Slate',
        desc: 'Pure white/dark backgrounds, subtle gray borders, blue CTAs. Like Linear/Vercel — ultra-clean, professional, content-first.',
        accent: '#1D9BF0'
      },
      'soft-luxury': {
        name: 'Soft Luxury',
        desc: 'Warm stone tints, refined shadows, blue accents. Like Stripe — premium feel without being cold. Soft, inviting, professional.',
        accent: '#3B82F6'
      },
      'editorial-bold': {
        name: 'Editorial Bold',
        desc: 'High contrast typography, generous whitespace, blue accents. Like Twitter/X — bold headlines, clean hierarchy, dramatic.',
        accent: '#1D9BF0'
      },
      'glass-refined': {
        name: 'Glass Refined',
        desc: 'Frosted glass cards with backdrop blur, indigo gradient CTAs. Modern depth, airy feel, contemporary luxury.',
        accent: '#6366F1'
      },
      'dark-elegance': {
        name: 'Dark Elegance',
        desc: 'Rich dark backgrounds, gold/amber accents. Luxurious, sophisticated, high-end feel. Like premium salon branding.',
        accent: '#D4A574'
      }
    };

    const appHTML = `
      <header class="header">
        <div class="header-brand">
          <div class="header-logo">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" d="M9.813 15.904L9 18.75l-.813-2.846a4.5 4.5 0 00-3.09-3.09L2.25 12l2.846-.813a4.5 4.5 0 003.09-3.09L9 5.25l.813 2.846a4.5 4.5 0 003.09 3.09L15.75 12l-2.846.813a4.5 4.5 0 00-3.09 3.09z" />
            </svg>
          </div>
          <span class="header-title">Forehand Nail</span>
        </div>
        <div class="header-menu">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" d="M3.75 6.75h16.5M3.75 12h16.5m-16.5 5.25h16.5" />
          </svg>
        </div>
      </header>

      <section class="hero">
        <div class="hero-avatar">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" d="M9.813 15.904L9 18.75l-.813-2.846a4.5 4.5 0 00-3.09-3.09L2.25 12l2.846-.813a4.5 4.5 0 003.09-3.09L9 5.25l.813 2.846a4.5 4.5 0 003.09 3.09L15.75 12l-2.846.813a4.5 4.5 0 00-3.09 3.09z" />
          </svg>
        </div>
        <h1 class="hero-name">Forehand Nail</h1>
        <p class="hero-slogan">Nail Art Studio</p>
        <p class="hero-desc">نمونه‌کار، رزرو آنلاین، و مدیریت قرارها — همه در یک مکان</p>

    function switchTheme(theme) {
      // Update tabs
      document.querySelectorAll('.theme-tab').forEach(tab => tab.classList.remove('active'));
      event.target.classList.add('active');

      // Update description
      document.getElementById('desc-title').textContent = themes[theme].name;
      document.getElementById('desc-text').textContent = themes[theme].desc;

      // Show/hide frames
      document.querySelectorAll('.phone-frame').forEach(f => f.classList.add('hidden'));
      document.getElementById('frame-' + theme).classList.remove('hidden');
    }
