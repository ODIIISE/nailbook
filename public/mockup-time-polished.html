<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Polished Time Selection</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;700;800&display=swap" rel="stylesheet">
  <style>
    :root { --bg: #000000; --fg: #FAFAFA; --card: #0F0F10; --border: #262626; --muted: #B5B5B5; --radius: 18px; }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body { margin: 0; font-family: 'Vazirmatn', sans-serif; background: var(--bg); color: var(--fg); min-height: 100dvh; padding: 24px 16px 120px; max-width: 430px; margin-inline: auto; }
    .header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; }
    .back { width: 40px; height: 40px; display: grid; place-items: center; border-radius: 12px; background: var(--card); border: 1px solid var(--border); color: var(--fg); }
    .title { font-size: 18px; font-weight: 800; }
    .subtitle { font-size: 13px; color: var(--muted); }

    .days { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 8px; margin-bottom: 16px; scrollbar-width: none; }
    .days::-webkit-scrollbar { display: none; }
    .day { flex: 0 0 64px; height: 72px; border-radius: var(--radius); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; background: var(--card); border: 1px solid var(--border); color: var(--muted); }
    .day.active { background: var(--fg); color: var(--bg); border-color: var(--fg); }
    .day .dow { font-size: 11px; font-weight: 500; }
    .day .num { font-size: 17px; font-weight: 800; }

    .hero { background: var(--fg); color: var(--bg); border-radius: var(--radius); padding: 20px; display: flex; align-items: center; justify-content: space-between; margin-bottom: 24px; cursor: pointer; transition: transform .15s; }
    .hero:active { transform: scale(0.98); }
    .hero-label { font-size: 12px; opacity: .7; margin-bottom: 4px; }
    .hero-time { font-size: 28px; font-weight: 800; }
    .hero-action { font-size: 12px; font-weight: 700; padding: 8px 14px; border-radius: 999px; background: var(--bg); color: var(--fg); }

    .section-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
    .section-title { font-size: 14px; font-weight: 700; }
    .section-count { font-size: 12px; color: var(--muted); }

    .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
    .slot { height: 54px; border-radius: 14px; border: 1px solid var(--border); background: var(--card); color: var(--fg); font-size: 15px; font-weight: 700; display: grid; place-items: center; cursor: pointer; transition: .15s; }
    .slot:active { transform: scale(0.96); }
    .slot.selected { background: var(--fg); color: var(--bg); border-color: var(--fg); }
    .slot.suggested { border-color: var(--fg); }

    .empty-state { text-align: center; padding: 40px 20px; border: 1px dashed var(--border); border-radius: var(--radius); }
    .empty-state-title { font-size: 15px; font-weight: 700; margin-bottom: 6px; }
    .empty-state-desc { font-size: 13px; color: var(--muted); margin-bottom: 16px; }
    .empty-btn { height: 44px; padding: 0 24px; border-radius: 999px; border: 1px solid var(--border); background: var(--card); color: var(--fg); font-family: inherit; font-size: 14px; font-weight: 700; cursor: pointer; }

    .bottom { position: fixed; bottom: 0; left: 0; right: 0; max-width: 430px; margin-inline: auto; padding: 16px; background: linear-gradient(to top, var(--bg) 80%, transparent); }
    .btn { width: 100%; height: 52px; border-radius: var(--radius); border: none; background: var(--fg); color: var(--bg); font-family: inherit; font-size: 15px; font-weight: 800; cursor: pointer; }
    .btn:disabled { opacity: .35; cursor: not-allowed; }
  </style>
</head>
<body>
  <div class="header">
    <div class="back">→</div>
    <div><div class="title">انتخاب زمان</div><div class="subtitle">مانیکور ناخن طبیعی</div></div>
    <div style="width:40px"></div>
  </div>

  <div class="days">
    <div class="day"><span class="dow">شنبه</span><span class="num">۱۲</span></div>
    <div class="day active"><span class="dow">یک‌شنبه</span><span class="num">۱۳</span></div>
    <div class="day"><span class="dow">دوشنبه</span><span class="num">۱۴</span></div>
    <div class="day"><span class="dow">سه‌شنبه</span><span class="num">۱۵</span></div>
  </div>

  <div class="hero" onclick="selectHero()">
    <div>
      <div class="hero-label">نزدیک‌ترین ساعت آزاد</div>
      <div class="hero-time">۱۵:۴۵</div>
    </div>
    <span class="hero-action">رزرو سریع</span>
  </div>

  <div class="section-header">
    <span class="section-title">ساعت‌های موجود</span>
    <span class="section-count">۱۴ ساعت</span>
  </div>

  <div class="grid" id="slots">
    <div class="slot suggested" onclick="toggle(this)">۱۵:۴۵</div>
    <div class="slot" onclick="toggle(this)">۱:۰۰</div>
    <div class="slot" onclick="toggle(this)">۱۶:۱</div>
    <div class="slot" onclick="toggle(this)">۱۶:۳۰</div>
    <div class="slot" onclick="toggle(this)">۱۶:۴۵</div>
    <div class="slot" onclick="toggle(this)">۱۷:۰۰</div>
    <div class="slot" onclick="toggle(this)">۱:۱</div>
    <div class="slot" onclick="toggle(this)">۱۷:۳۰</div>
    <div class="slot" onclick="toggle(this)">۱۷:۴۵</div>
    <div class="slot" onclick="toggle(this)">۱۸:۰۰</div>
    <div class="slot" onclick="toggle(this)">۱۸:۱</div>
    <div class="slot" onclick="toggle(this)">۱:۳۰</div>
  </div>

  <div class="bottom"><button class="btn" id="continue" disabled>ادامه</button></div>

  <script>
    let selected = null;
    function toggle(el) { document.querySelectorAll('.slot').forEach(s => s.classList.remove('selected')); if (selected === el) { selected = null; document.getElementById('continue').disabled = true; return; } el.classList.add('selected'); selected = el; document.getElementById('continue').disabled = false; }
    function selectHero() { const first = document.querySelector('.slot'); if (first) toggle(first); }
  </script>
</body>
</html>
