.meal .im{width:76px;height:76px;border-radius:18px;flex-shrink:0}
.f1{background:linear-gradient(140deg,#FFE4D6,#F8A88B)}
.f2{background:linear-gradient(140deg,#FBD1DD,#F0789F)}
.meal .bd{flex:1}
.meal b{font-size:14px;display:block}
.meal .meta{display:flex;gap:8px;margin-top:6px}
.meal .meta span{font-size:10px;background:#F3F4F6;color:#6B7280;padding:3px 8px;border-radius:999px}
.meal .pr{display:flex;flex-direction:column;align-items:flex-end;gap:8px}
.meal .pr b{font-size:13px;color:#F26B5E}
.meal .add{width:34px;height:34px;border-radius:50%;background:#F26B5E;color:#fff;display:flex;align-items:center;justify-content:center;font-size:16px}
.cta{position:absolute;bottom:22px;right:22px;left:22px;background:#F26B5E;color:#fff;text-align:center;text-decoration:none;font-size:15px;font-weight:700;padding:17px;border-radius:18px;box-shadow:0 12px 26px rgba(242,107,94,.35)}
