<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>05 Pastel Serif — SoGlow inspired</title>
<link href="https://fonts.googleapis.com/css2?family=Markazi+Text:wght@500;600;700&display=swap" rel="stylesheet">
<style>
@font-face{font-family:Vazirmatn;src:url(https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/fonts/webfonts/Vazirmatn-Regular.woff2) format('woff2');font-weight:400;font-display:swap}
@font-face{font-family:Vazirmatn;src:url(https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/fonts/webfonts/Vazirmatn-Medium.woff2) format('woff2');font-weight:500;font-display:swap}
@font-face{font-family:Vazirmatn;src:url(https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/fonts/webfonts/Vazirmatn-Bold.woff2) format('woff2');font-weight:700;font-display:swap}
*{margin:0;padding:0;box-sizing:border-box}
body{background:#dcd9d4;display:flex;justify-content:center;font-family:Vazirmatn,system-ui,sans-serif}
.app{width:390px;min-height:100dvh;background:#fff;color:#222;position:relative;padding:0 20px 96px}
.serif{font-family:'Markazi Text',Vazirmatn,serif}
.top{display:flex;justify-content:space-between;align-items:center;padding:22px 0}
.lotus{width:34px;height:34px;border-radius:50%;background:linear-gradient(140deg,#7A4CE0,#9D7BEA);display:flex;align-items:center;justify-content:center;color:#fff;font-size:15px}
.top a{font-size:12px;color:#666;text-decoration:none}
.greet{font-size:13px;color:#8A8A8A}
.greet h1{font-size:30px;color:#222;margin-top:4px}
.cats{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:22px}
.cat{border-radius:22px;padding:20px 18px;height:104px;display:flex;flex-direction:column;justify-content:flex-end;text-decoration:none;color:#3A3350}
.cat b{font-size:15px}
.cat span{font-size:11px;opacity:.75;margin-top:2px}
.c1{background:#D9C7F0}
.c2{background:#F5D0D8}
.c3{background:#A9D6D5}
.c4{background:#F2BFA8}
.now{margin-top:28px}
.now .hd{display:flex;justify-content:space-between;align-items:baseline}
.now h2{font-size:16px;font-weight:700}
.now a{font-size:11px;color:#7A4CE0;text-decoration:none}
.cards{display:flex;gap:12px;margin-top:14px;overflow:hidden}
.cc{width:150px;flex-shrink:0;border-radius:20px;overflow:hidden;background:#FAF9FC;border:1px solid #F0ECF7}
.cc .im{height:110px}
.m1{background:linear-gradient(140deg,#D9C7F0,#B99AE8)}
.m2{background:linear-gradient(140deg,#F5D0D8,#EBA9B9)}
.m3{background:linear-gradient(140deg,#A9D6D5,#7FBDBA)}
.cc .bd{padding:12px 14px}
.cc b{font-size:13px;display:block}
.cc span{font-size:11px;color:#8A8A8A}
.cc .p{font-size:12.5px;font-weight:700;margin-top:6px;color:#3A3350}
.welcome{margin:30px 0 0;background:linear-gradient(160deg,#EDE7FB,#FBEFF2);border-radius:24px;padding:26px 22px;text-align:center}
.welcome .serif{font-size:26px;font-weight:700;color:#3A3350}
.welcome p{font-size:12px;color:#7A7490;margin-top:6px}
.welcome a{display:inline-block;margin-top:16px;background:#26335E;color:#fff;font-size:13px;font-weight:500;padding:13px 30px;border-radius:999px;text-decoration:none}
.nav{position:absolute;bottom:0;right:0;left:0;background:#fff;border-top:1px solid #F0ECF7;display:flex;justify-content:space-around;padding:13px 0 24px}
.nav a{font-size:11px;color:#B0ACC0;text-decoration:none}
.nav a.on{color:#7A4CE0;font-weight:700}
</style></head><body><div class="app">
<div class="top"><div class="lotus">✦</div><a href="#">پروفایل</a></div>
<div class="greet">سلام، مهسا<h1 class="serif">امروز درخشان باش</h1></div>
<div class="cats">
<a class="cat c1" href="#"><b>ناخن</b><span>۱۲ خدمت</span></a>
<a class="cat c2" href="#"><b>طراحی</b><span>۸ خدمت</span></a>
<a class="cat c3" href="#"><b>مراقبت</b><span>۶ خدمت</span></a>
<a class="cat c4" href="#"><b>پکیج ویژه</b><span>۴ خدمت</span></a>
</div>
<div class="now"><div class="hd"><h2>پیشنهاد این هفته</h2><a href="#">همه</a></div>
<div class="cards">
<div class="cc"><div class="im m1"></div><div class="bd"><b>پکیج عروس</b><span>۳ سشن</span><div class="p">۲٬۴۰۰٬۰۰۰</div></div></div>
<div class="cc"><div class="im m2"></div><div class="bd"><b>ژلیش + طراحی</b><span>۲ ساعت</span><div class="p">۱٬۱۵۰٬۰۰۰</div></div></div>
<div class="cc"><div class="im m3"></div><div class="bd"><b>اسپا دست</b><span>۴۵ دقیقه</span><div class="p">۵۹۰٬۰۰۰</div></div></div>
</div></div>
<div class="welcome"><div class="serif">اولین بار است؟</div><p>با کد خوش‌آمدگویی ۲۰٪ تخفیف بگیرید</p><a href="#">شروع کنید</a></div>
<div class="nav"><a class="on" href="#">خانه</a><a href="#">کاوش</a><a href="#">نوبت‌ها</a><a href="#">ذخیره‌ها</a><a href="#">پروفایل</a></div>
</div></body></html>
