<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>12 Midnight Glow — Milkinside inspired</title>
<style>
@font-face{font-family:Vazirmatn;src:url(https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/fonts/webfonts/Vazirmatn-Regular.woff2) format('woff2');font-weight:400;font-display:swap}
@font-face{font-family:Vazirmatn;src:url(https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/fonts/webfonts/Vazirmatn-Medium.woff2) format('woff2');font-weight:500;font-display:swap}
@font-face{font-family:Vazirmatn;src:url(https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/fonts/webfonts/Vazirmatn-Bold.woff2) format('woff2');font-weight:700;font-display:swap}
*{margin:0;padding:0;box-sizing:border-box}
body{background:#222;display:flex;justify-content:center;font-family:Vazirmatn,system-ui,sans-serif}
.app{width:390px;min-height:100dvh;background:#0A0A0F;color:#F5F4FF;position:relative;padding:0 22px 100px;overflow:hidden}
.glow{position:absolute;width:320px;height:320px;border-radius:50%;filter:blur(90px);opacity:.45;pointer-events:none}
.g1{background:#7C3AED;top:-80px;left:-60px}
.g2{background:#EC4899;top:220px;right:-100px;opacity:.3}
.top{display:flex;justify-content:space-between;align-items:center;padding:24px 0;position:relative}
.logo{font-weight:700;font-size:16px}
.logo i{font-style:normal;background:linear-gradient(120deg,#A78BFA,#F472B6);-webkit-background-clip:text;background-clip:text;color:transparent}
.top a{font-size:12px;color:#8B87A8;text-decoration:none}
.hero{position:relative;margin-top:34px}
.pill{display:inline-block;font-size:11px;color:#C4B5FD;border:1px solid #3B3560;padding:6px 14px;border-radius:999px;margin-bottom:16px}
.hero h1{font-size:30px;font-weight:700;line-height:1.55}
.hero h1 i{font-style:normal;background:linear-gradient(120deg,#C4B5FD,#F9A8D4);-webkit-background-clip:text;background-clip:text;color:transparent}
.hero p{font-size:13px;color:#8B87A8;line-height:1.95;margin-top:12px}
.cta{display:block;margin-top:26px;background:linear-gradient(120deg,#8B5CF6,#EC4899);color:#fff;text-align:center;text-decoration:none;font-size:14.5px;font-weight:700;padding:17px;border-radius:999px;box-shadow:0 12px 32px rgba(139,92,246,.4)}
.cta2{display:block;margin-top:12px;text-align:center;font-size:12.5px;color:#8B87A8;text-decoration:none;padding:12px;border-radius:999px;border:1px solid #2A2740}
.stats{display:flex;gap:10px;margin-top:30px;position:relative}
.st{flex:1;background:rgba(255,255,255,.04);border:1px solid #23203A;border-radius:18px;padding:16px 14px}
.st b{font-size:19px;font-weight:700;display:block;background:linear-gradient(120deg,#E9D5FF,#FBCFE8);-webkit-background-clip:text;background-clip:text;color:transparent}
.st span{font-size:10.5px;color:#8B87A8;display:block;margin-top:4px}
.cards{margin-top:32px;position:relative}
.cards h2{font-size:14px;color:#B8B4D0;margin-bottom:14px}
.strip{display:flex;gap:10px;overflow:hidden}
.tile{width:110px;height:140px;border-radius:18px;flex-shrink:0;border:1px solid #262244}
.t1{background:linear-gradient(160deg,#2A2140,#120F1E)}
.t2{background:linear-gradient(160deg,#3A1E33,#170F1A)}
.t3{background:linear-gradient(160deg,#1E2440,#0F1120)}
.nav{position:absolute;bottom:0;right:0;left:0;background:rgba(10,10,15,.92);backdrop-filter:blur(12px);border-top:1px solid #23203A;display:flex;justify-content:space-around;padding:15px 0 24px}
.nav a{font-size:11px;color:#6E6988;text-decoration:none}
.nav a.on{color:#C4B5FD;font-weight:700}
</style></head><body><div class="app">
<div class="glow g1"></div><div class="glow g2"></div>
<div class="top"><div class="logo">فورهند<i>نيل</i></div><a href="#">ورود</a></div>
<div class="hero">
<div class="pill">✦ استودیوی هنری ناخن</div>
<h1>ناخن‌های تو،<br><i>تابان</i> در تاریکی</h1>
<p>تجربه‌ای متفاوت از رزرو و طراحی ناخن — سریع، هوشمند و شخصی‌سازی‌شده برای دست‌های تو.</p>
<a class="cta" href="#">شروع رزرو هوشمند</a>
<a class="cta2" href="#">مشاهده گالری هنر</a>
</div>
<div class="stats">
<div class="st"><b>+۲۴۰</b><span>رزرو این هفته</span></div>
<div class="st"><b>۴٫۹★</b><span>رضایت مشتری</span></div>
<div class="st"><b>۸ سال</b><span>تجربه استودیو</span></div>
</div>
<div class="cards"><h2>ترندهای این فصل</h2><div class="strip"><div class="tile t1"></div><div class="tile t2"></div><div class="tile t3"></div></div></div>
<div class="nav"><a class="on" href="#">خانه</a><a href="#">رزرو</a><a href="#">نوبت‌ها</a><a href="#">پروفایل</a></div>
</div></body></html>
